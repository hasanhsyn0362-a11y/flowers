        let seed = 5;
        function rand() {
            seed = (seed * 1664525 + 1013904223) >>> 0;
            return seed / 4294967296;
        }
        function uniform(min, max) { return min + (max - min) * rand(); }
        function randn(mean = 0, std = 1) {
            let u = 0, v = 0;
            while (u === 0) u = rand();
            while (v === 0) v = rand();
            return mean + std * Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
        }
        function choice(arr, probs) {
            if (!probs) return arr[Math.floor(rand() * arr.length)];
            let r = rand(), acc = 0;
            for (let i = 0; i < arr.length; i++) {
                acc += probs[i];
                if (r <= acc) return arr[i];
            }
            return arr[arr.length - 1];
        }
